services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novahaven}
      POSTGRES_USER: ${POSTGRES_USER:-novahaven}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique local password in .env first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - nova_postgres_data:/var/lib/postgresql/data
volumes:
  nova_postgres_data:
